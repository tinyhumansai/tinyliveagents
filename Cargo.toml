[workspace]
resolver = "3"
# Every crate lives under `crates/`, one directory per package, each directory
# named for the package it holds. There is no root package.
members = ["crates/*"]
# `cargo test` / `cargo build` with no `-p` cover the library only. The
# examples crate holds the live, network-touching tests and runnable demos; it
# is built by `--workspace` / `--all-targets` runs but never runs against a real
# provider unless its `#[ignore]`d tests are asked for explicitly.
default-members = ["crates/tinyliveagents"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest, so without this entry cargo walks into
# them and reports duplicate packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyliveagents"

[workspace.dependencies]
tinyliveagents = { path = "crates/tinyliveagents" }
# Every provider session is a tokio task driving one or more sockets.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
] }
# WebSocket client (and, in tests, the mock server) for every provider.
# rustls with the webpki roots keeps the crate free of a system TLS library.
# 0.29 matches the version OpenHuman already ships, so vendoring this crate
# adds no second copy of tungstenite.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# `SinkExt` / `StreamExt` over the WebSocket halves.
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
# Cheaply cloned audio buffers; tungstenite frames already carry `Bytes`.
bytes = "1"
# Provider wire frames are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 audio payloads (Gemini, ElevenLabs, Sarvam all wrap PCM in JSON).
base64 = "0.22"
# The crate-wide error enum.
thiserror = "2"
# `LiveProvider` is an async trait used behind `dyn`.
async-trait = "0.1"
# Building provider URLs with escaped query parameters.
url = "2"
# Sarvam's chat completions endpoint is plain HTTPS with SSE streaming.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }
# Structured, content-free diagnostics for hosts that install a subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
